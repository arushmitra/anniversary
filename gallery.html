<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<style>
  :root { --s: min(72vw, 50vh, 520px); --pink: #e4799a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2b2b35 0%, #0b0b0f 72%);
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .back {
    position: fixed; z-index: 10;
    top: max(14px, env(safe-area-inset-top)); left: 16px;
    color: #fff; text-decoration: none; font-size: 1rem;
    padding: .5em 1em; border-radius: 999px; background: rgba(255,255,255,.14);
  }
  .back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .music {
    position: fixed; z-index: 10;
    top: max(14px, env(safe-area-inset-top)); right: 16px;
    width: 44px; height: 44px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: none; color: #fff;
    font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .music:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .stage {
    position: absolute; left: 0; right: 0; top: 0; bottom: 150px;
    perspective: 1100px; perspective-origin: 50% 40%;
    overflow: hidden; touch-action: pan-y;
  }
  .item {
    position: absolute; left: 50%; top: 46%;
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    display: flex; align-items: flex-end; justify-content: center;
    transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .4s;
    will-change: transform; cursor: pointer;
  }
  .item img {
    max-width: 100%; max-height: 100%; display: block; pointer-events: none;
    -webkit-user-drag: none;
    -webkit-box-reflect: below 1px linear-gradient(to bottom, transparent 62%, rgba(255,255,255,.3));
  }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; text-align: center;
    padding: 0 1.5rem max(18px, env(safe-area-inset-bottom));
  }
  .title { font-size: clamp(1.1rem, 2.4vw + .5rem, 1.6rem); font-weight: 600; min-height: 1.3em; }
  .count { font-size: clamp(1rem, 2vw + .4rem, 1.4rem); font-weight: 600; color: #ddd; margin-bottom: 14px; }
  input[type=range] { width: min(560px, 86vw); accent-color: var(--pink); }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back</a>
  <button class="music" id="musicBtn" aria-label="Play music" aria-pressed="false">&#9835;</button>
  <audio id="bgAudio" src="01_her.mp3" loop preload="auto"></audio>
  <div class="stage" id="stage"></div>
  <div class="panel">
    <div class="title" id="title"></div>
    <div class="count" id="count"></div>
    <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scroll through photos">
  </div>

<script>
  // Hardcoded from the actual repo file list (github.com/arushmitra/anniversary).
  // The 7 HEIC files (34, 36, 38, 40, 41, 46, 47) are left out until they're
  // converted to JPG - browsers can't display HEIC. Once converted, add them
  // to this list (e.g. '34.jpg') and re-upload this file.
  const FILES = [
    '1.JPG','2.JPG','3.JPG','4.jpeg','5.jpeg','6.jpeg','7.jpeg','8.jpeg','9.jpeg',
    '10.jpeg','11.jpeg','12.jpeg','13.jpeg','14.jpeg','15.jpeg','16.jpeg','17.jpeg',
    '18.jpeg','19.jpeg','20.jpeg','21.jpeg','22.jpeg','23.jpeg','24.jpeg','25.jpeg',
    '26.jpeg','27.jpeg','28.jpeg','29.jpeg','30.jpeg','31.jpeg','32.jpeg','33.jpeg',
    '35.jpeg','37.jpeg','39.jpeg','42.jpeg','43.jpg','44.JPG','45.JPG','48.JPEG'
  ];

  const stage = document.getElementById('stage');
  const titleEl = document.getElementById('title');
  const countEl = document.getElementById('count');
  const scrub = document.getElementById('scrub');
  let photos = FILES.map(f => ({ src: encodeURIComponent(f) }));
  let items = [], cur = 0;

  function layout() {
    const S = items[0].offsetWidth || 400;
    items.forEach((el, i) => {
      const d = i - cur, a = Math.abs(d), s = Math.sign(d);
      let x = 0, z = 110, r = 0;
      if (d !== 0) {
        x = s * (S * 0.72 + (a - 1) * S * 0.16);
        z = -40 - a * 8;
        r = -s * 68;
      }
      el.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${r}deg)`;
      el.style.zIndex = 100 - a;
      el.style.opacity = a > 7 ? 0 : 1;
      el.style.pointerEvents = a > 7 ? 'none' : 'auto';
      const img = el.firstChild;
      if (a <= 8 && !img.getAttribute('src')) img.src = photos[i].src;
    });
    titleEl.textContent = 'Us \u2665';
    countEl.textContent = `${cur + 1} of ${photos.length}`;
    scrub.value = cur;
  }

  function go(i) {
    cur = Math.max(0, Math.min(photos.length - 1, i));
    layout();
  }

  let dragStart = null, moved = false;
  stage.addEventListener('pointerdown', e => { dragStart = e.clientX; moved = false; });
  window.addEventListener('pointermove', e => {
    if (dragStart === null) return;
    const dx = e.clientX - dragStart;
    if (Math.abs(dx) > 50) { go(cur + (dx < 0 ? 1 : -1)); dragStart = e.clientX; moved = true; }
  });
  window.addEventListener('pointerup', () => { dragStart = null; });
  window.addEventListener('pointercancel', () => { dragStart = null; });

  let lastWheel = 0;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastWheel < 110) return;
    lastWheel = now;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(d) > 2) go(cur + (d > 0 ? 1 : -1));
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(photos.length - 1);
  });
  scrub.addEventListener('input', () => go(+scrub.value));
  window.addEventListener('resize', layout);

  scrub.max = photos.length - 1;
  photos.forEach((ph, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    const img = document.createElement('img');
    img.alt = 'Photo ' + (i + 1);
    img.decoding = 'async';
    el.appendChild(img);
    el.addEventListener('click', () => { if (moved) { moved = false; return; } go(i); });
    stage.appendChild(el);
    items.push(el);
  });
  cur = 0;
  layout();

  const audio = document.getElementById('bgAudio');
  const musicBtn = document.getElementById('musicBtn');
  let playing = false;

  function setPlaying(p) {
    playing = p;
    musicBtn.textContent = playing ? '\u23F8' : '\u266B';
    musicBtn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
    musicBtn.setAttribute('aria-pressed', String(playing));
  }

  musicBtn.addEventListener('click', () => {
    if (playing) { audio.pause(); setPlaying(false); }
    else { audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false)); }
  });

  // Try to autoplay as soon as the page loads; most browsers block this
  // until the visitor interacts, so fall back to starting on the first tap.
  audio.play().then(() => setPlaying(true)).catch(() => {
    const startOnce = () => {
      audio.play().then(() => setPlaying(true)).catch(() => {});
      window.removeEventListener('pointerdown', startOnce);
      window.removeEventListener('keydown', startOnce);
    };
    window.addEventListener('pointerdown', startOnce, { once: true });
    window.addEventListener('keydown', startOnce, { once: true });
  });
</script>
</body>
</html>
